# The `validate` lane for the vizra META repo (docs/META_REPO.md §7).
#
# This repository carries no product code: it is the contract, the product spec,
# the ADRs, the ledgers, the plans and the evidence. What can go wrong here is
# therefore documentary, and three failures are worth a gate:
#
#   (a) the GENERATED ledger no longer matches its sources — either it was
#       hand-edited (AGENTS.md forbids it) or a generator source changed without
#       regenerating. Both look identical in review and both are caught by
#       regenerating and diffing.
#   (b) a quality JSON does not parse, or the milestone plan and issue files
#       schedule work by a `VZ-…` id that names no requirement.
#   (c) a relative markdown link points at a file that does not exist.
#
# Since VZ-ISSUE-002 this repository also carries a deployment topology, so a
# fourth failure is worth a gate here:
#
#   (d) the rendered compose model opens a port, loses a restart policy or a
#       log cap, reintroduces a `build:` into a production shape, runs an
#       unpinned image, or drifts from the component configuration registries.
#       None of that is visible in review — a datastore can be published by an
#       overlay three files away from the one being read — and all of it is
#       visible in `docker compose config --format json`.
#
# META_REPO.md §7 names two further target lanes for this repo, `bundle` and
# `boot`. Neither is built here. There is now a compose topology, but there is
# still no installer, no bundle builder and no booted stack — `validate` renders
# the production shapes and asserts them, and has never started a container.
# `bundle` and `boot` are therefore still deliberately absent from
# .github/required-checks.txt rather than present and empty; see that file. Its
# comment block still says "there is no compose file", which this PR does not
# edit: AGENTS.md forbids changing the required-check manifest in the same PR
# as the thing it guards. That stale sentence is REPORTED, not silently fixed.
#
# The trigger deliberately carries NO base-branch filter. This lane's own pull
# request is STACKED on `chore/m0-meta-baseline`, not on `main`, and a
# `branches: [main]` filter would skip the lane on exactly that PR while
# `ci-required` waited for a check nobody scheduled.
# scripts/check-action-pins.py enforces that statically.

name: validate

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The generated-ledger check runs `git diff` against HEAD, so it needs
          # the commit it is diffing. fetch-depth 1 is enough — nothing here
          # reads history.
          fetch-depth: 1

      # A pinned interpreter, not "whatever the runner image ships". The ledger
      # generator's output must be reproducible, and the Python version is part
      # of that: dict ordering, json.dump formatting and float repr are all
      # interpreter behaviour. 3.12.14 is the current stable 3.12 in
      # actions/python-versions.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      # Provenance must name the tree this run actually stands in.
      #
      # `actions/checkout` with no `ref:` checks out `refs/pull/N/merge` on a
      # pull_request event — the PR head already merged into the CURRENT base.
      # That is the right thing to test, and it is deliberately NOT pinned to the
      # head. But it means the tested tree is a commit that exists nowhere in
      # either branch, and it CHANGES WHEN THE BASE MOVES while the head SHA
      # stays put. This repository's base branch moves often: the war-room chair
      # commits the board to it every tick.
      #
      # Printing only "source SHA: <head>" was therefore misleading — it named a
      # tree that was not the one being validated. All three are printed now,
      # labelled, so a transcript can never be read as a claim about the wrong
      # tree.
      - name: record the environment and the tree under test
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          python3 --version
          python3 -c 'import locale,sys; print("filesystem encoding:", sys.getfilesystemencoding()); print("preferred encoding:", locale.getpreferredencoding(False))'
          git --version
          echo
          echo "event: ${GITHUB_EVENT_NAME}"
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              echo "PR head SHA (what ci-required is reported against): ${PR_HEAD}"
              echo "PR base SHA (the base this was merged into):        ${PR_BASE}"
              echo "TREE UNDER TEST (the merge commit actually checked out):"
              echo "  $(git rev-parse HEAD)"
              echo "  -> this lane validates the MERGE of head into the current base,"
              echo "     not the head commit on its own. The base moves, so this tree can"
              echo "     change while the head SHA does not."
              ;;
            merge_group)
              echo "merge-queue head SHA: ${MERGE_GROUP_HEAD}"
              echo "merge-queue base SHA: ${MERGE_GROUP_BASE}"
              echo "TREE UNDER TEST (the queued merge commit): $(git rev-parse HEAD)"
              ;;
            *)
              echo "ref: ${GITHUB_REF}"
              echo "TREE UNDER TEST: $(git rev-parse HEAD) (checked out directly; no merge)"
              ;;
          esac

      # (a) The generated ledger reproduces byte-for-byte from its sources.
      - name: the generated ledger matches its sources
        run: ./scripts/check-generated-ledger.sh

      # (b) Every quality JSON parses, and every VZ-… id resolves.
      - name: quality JSON parses and every requirement id resolves
        run: ./scripts/check-quality-json.py

      # (c) Relative markdown links resolve. No network I/O: external URLs are
      # recorded and never fetched.
      - name: relative documentation links resolve
        run: ./scripts/check-doc-links.py

      # ---------------------------------------------------------------------
      # (d) THE COMPOSE TOPOLOGY (VZ-ISSUE-002: VZ-TOPOLOGY-001/-002/-003/-006/
      #     -007, VZ-CI-002, VZ-OPS-008).
      #
      # These steps are added to the EXISTING `validate` job rather than to a
      # new lane, deliberately. A new lane would have to be added to
      # `.github/required-checks.txt` and to the floor in
      # `scripts/ci-required-guard.sh` — both owner-reviewed under CODEOWNERS,
      # and AGENTS.md says a manifest must not be edited in the same PR as the
      # thing it guards. `validate` is already the floor lane and already
      # required, so extending it gates the new checks with no manifest change
      # at all. Neither file is touched by this PR.
      #
      # Nothing here pulls or builds an image. `docker compose config` resolves
      # the model from the files and the environment; it never contacts a
      # registry, so the lane needs no credentials and no network beyond the
      # checkout.
      # ---------------------------------------------------------------------

      # The interpreter this lane runs on is `actions/setup-python` 3.12.14, NOT
      # the runner's system python — and PyYAML is preinstalled on the latter
      # only. The first CI run of this lane failed here with
      # `ModuleNotFoundError: No module named 'yaml'`, which is why this step
      # exists and why the claim "the runner ships PyYAML" was wrong about the
      # interpreter that actually executes these scripts.
      #
      # Same shape and same pin as .github/workflows/ci-required.yml: install
      # only if absent, so the lane fails on a real violation rather than on a
      # missing library, and pinned so it is not a moving dependency.
      - name: ensure a YAML parser is available
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages 'pyyaml==6.0.3'
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: record the container toolchain this lane renders with
        run: |
          set -euo pipefail
          docker --version
          docker compose version
          docker compose version --short
          echo
          echo "The Compose FLOOR (>= 2.24.4, ruling Q-017) is enforced by"
          echo "scripts/compose-render.py, which fails closed on a version string it"
          echo "cannot parse. It is printed here as well so a transcript records"
          echo "which Compose produced the models below."

      # Render first, upload second, assert third. The order is deliberate: a
      # step-level `if: always()` on the upload would be refused by
      # scripts/check-lane-integrity.py (a conditional step on a required lane
      # is not a gate), so the artifact is produced BEFORE anything can fail.
      # A render that fails produces no model to upload anyway.
      - name: render every declared compose shape
        run: |
          set -euo pipefail
          ./scripts/compose-render.py --list
          echo
          ./scripts/compose-render.py --all --out build/compose-models
          mkdir -p ci-report
          cp -R build/compose-models ci-report/compose-models

      - name: upload the rendered compose models
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meta-validate-compose-models
          path: ci-report/
          retention-days: 14
          if-no-files-found: error

      # Port closure, edge profile, restart policies, log caps, healthchecks,
      # one-shot/production build, image pinning, Docker-socket absence,
      # production mode and development-hatch absence — every one asserted from
      # `docker compose config --format json` parsed as JSON, never from the
      # YAML sources.
      - name: the rendered topology is closed, capped and pinned
        run: ./scripts/check-compose-topology.py build/compose-models

      # Both directions: a key a component reads with nothing delivering it,
      # and a template key nothing consumes.
      - name: configuration-key coverage in both directions
        run: ./scripts/check-config-coverage.py build/compose-models

      # The guards are exercised against controlled mutations on every run, not
      # only in a one-off demonstration. This is the same rule
      # scripts/ci-required-guard.sh applies to its negative fixtures: a checker
      # that silently stopped catching something would otherwise stay green.
      # The script prints a sha256 either side of each mutation and refuses to
      # score a case whose mutation did not apply, and it fails if the tree is
      # not byte-identical afterwards.
      - name: every compose guard still fails against a controlled mutation
        run: bash docs/evidence/compose-topology/demo.sh
